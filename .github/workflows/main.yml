name: Compilar Executable (.exe)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        cd Globalcap_auto1
        python -m pip install --upgrade pip
        pip install flask flask-cors pandas openpyxl pyinstaller

    - name: Compilar ejecutable con PyInstaller
      run: |
        cd Globalcap_auto1
        pyinstaller --onefile --noconsole --add-data "templates;templates" global.py

    - name: Guardar el ejecutable como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: Aplicacion-Exe
        path: Globalcap_auto1/dist/global.exe
